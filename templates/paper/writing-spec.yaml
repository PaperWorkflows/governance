# Writing Specification (required, content optional)

Venue-specific writing requirements collected from the user or target journal/conference.
This file guides the writing mode and review mode.

## Target Venue

venue: null                    # e.g. "IEEE INFOCOM 2026"
url: null                      # author guidelines URL
deadline: null                 # ISO date

## Length Requirements

target_chars: 15000            # target body length (Chinese chars)
max_chars: null                # hard limit (null = no limit)
min_chars: null                # minimum (null = no limit)

## Structure Requirements

abstract_max_words: 300        # max words per abstract language
abstract_min_words: 200        # min words per abstract language
keywords_min: 3                # min keyword count
keywords_max: 8                # max keyword count

## Citation Style

citation_style: null           # e.g. "GB/T 7714-2025", "IEEE", "ACM"
citation_url: null             # style guide URL

