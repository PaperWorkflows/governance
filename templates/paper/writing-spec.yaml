# Writing Specification（写作规格；必填，内容由目标刊决定）
#
# 机器可读约定（GC-2026-1111-02，PF-W11）：
#   - 本文件必须是**合法 YAML**。tools/paper.py 以 yaml.safe_load 读取本文件，
#     解析失败会被静默吞掉，导致目标刊约束整体失效（2026-11-11 实测：7 篇论文的
#     本文件均因头部散文与 "##" 标题行而解析失败）。
#   - 目标刊的格式要求写入下方各键，供写作模式、审核模式（PF-RV7）与构建期检查使用。
#   - 目标刊未规定处留 null；版式类空缺由所选 layout profile 的国标回落值补齐（PF-B14），
#     不在此处重复填写。
#   - 散文说明写在文件末尾的 notes: 块标量内，**不要**在头部写裸行散文或 "##" 标题。
#
# 目标刊：《数智技术研究与应用》"多模态时空大数据处理关键技术及应用研究"专刊
#   依据：该刊征稿启事格式要求全文（2026-11-11 用户提供），条目编号 S1–S20。

# ── 目标刊 ────────────────────────────────────────────────
venue: null                      # 例："数智技术研究与应用"
special_issue: null              # 专刊名称
url: null                        # 投稿网址
deadline: null                   # ISO date
citation_style: null             # 例："GB/T 7714 著者出版年制"
citation_url: null               # 标引规范出处 URL

# ── 篇幅 ──────────────────────────────────────────────────
target_chars: 15000              # 正文目标字数（中文字符）
min_chars: null                  # 下限；**目标刊写"15000 字左右"属建议性，不得写成硬下限**（PF-W11 第4条）
max_chars: null                  # 上限（null = 不限）

# ── 摘要与关键词 ──────────────────────────────────────────
abstract_target_chars: null      # 摘要目标字数（**中文字符数**，不是英文词数）
abstract_tolerance_pct: 10       # 容差百分比；目标刊写"左右/为宜"时按此换算
abstract_forbid_subjects: []     # 禁作主语的第一人称，如 [本文, 我们, 作者]
abstract_forbid_references: false    # 摘要内禁引文献
abstract_forbid_formulas: false      # 摘要内禁公式
abstract_forbid_special_symbols: false  # 摘要内禁特殊符号
keywords_min: 3
keywords_max: 8
keywords_separator: "；"          # 目标刊规定的分隔符（全角，按中文语境推定）

# ── 题名与署名 ────────────────────────────────────────────
title_max_chars: null            # 题名字数上限（目标刊"一般不超过…时为建议性，见 tolerance）
title_forbid_punctuation: false  # 题名是否禁标点
author_affiliation_inline: null  # 作者与单位的合排格式串，如 "作者姓名（单位，所在市 邮编）"
corresponding_author_mark: null  # 通信作者标记（样式由 layout profile 决定）
author_bio_required: false       # 是否要求作者简介
author_bio_fields: []            # 必填字段，如 [出生年, 性别, 籍贯, 学位, 职称, 研究方向, ...]

# ── 结构 ──────────────────────────────────────────────────
heading_levels: null             # 层次序号写法，如 "1、1.1、1.1.1、（1）、①"
conclusion_heading: null         # 收束章节标题（如 "结语"）
bilingual_parity_required: false # 中英题名/作者/单位/摘要/关键词须成对一致
abbreviation_first_use_full_form: false  # 缩略词首次出现须给全称+中文名

# ── 图表、公式、基金 ──────────────────────────────────────
figures_tables_text_first: false # 先文字后图表
formulas_editable_required: false  # 公式须可编辑对象（OMML），禁图片
funding_order: []                # 基金项目排序，如 [国家级, 省部级, 市级, 校级]

# ── 参考文献 ──────────────────────────────────────────────
references_zh_first: false       # 文后先中文后英文

# ── 交付 ──────────────────────────────────────────────────
submission_package: null         # 投稿材料清单
manuscript_types: []             # 可投稿件类型
special_requirements: []         # 匿名/补充材料/数据声明等目标刊特有要求

notes: |
  本文件为通用模板。投稿前须由目标刊的实际格式要求填写上方各键，并在每处注明来源
  （目标刊条款号 / 国标条款 / 自选回落）。填好后：
    1. paper.yaml.layout_profile 指向 templates/layout/registry.yaml 中登记的 venue profile；
    2. build/layout.yaml（L2）只保留 profile / kind 两个选择键（PF-B13）；
    3. 审核时按 PF-RV7 逐条机械核对，报告须给出实际值而非断言。
