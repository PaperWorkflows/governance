# Build Layout Overrides（L2 论文级覆盖层，PF-B3/PF-B10）
#
# 原散文内容（GC-2026-1111-01 修复 2026-11-11，保留为注释）：
#   Build Layout Overrides
#   Paper-level overrides for the selected layout profile.
#   See governance/build.md PF-B3 for layering rules.
#
# 缺陷说明：原模板第 3–4 行散文未加 "#"，YAML 解析结果为字符串标量（非对象），
# 不满足 schemas/layout-profile.schema.json（required: profile/kind,
# additionalProperties: false）。三篇论文（P1/P2/P3）同型缺陷已逐 paper 修复
# （见各论文 reviews/20261111-round2/closure.md），本文件为模板层同型修复，
# 与论文修复版保持一致。
#
# GC-2026-1111-02 修订：L2 层**只保留选择键**。
#   - profile：选择 L1 venue profile（须与 paper.yaml.layout_profile 一致，否则构建失败）
#   - kind：固定为 paper
#   结构身份键（page / citation / formulas / target_venue）在 L2 出现即构建失败
#   （PF-B3：不可被 paper config 覆盖；变更须走 profile 版本化）。
#   上一版本在本文件重复声明 A4 / 25.4mm 边距（即结构身份键 page），与 PF-B3 冲突，
#   已移除；页边距等由 L0/L1 profile 统一给出。
#
# 论文确需覆写版式时，只能覆写 typography 的可覆盖键（如 body_pt、line_spacing），
# 例如：
#   typography:
#     body_pt: 10.5
# 每次覆写都会在构建日志中记录 old / new / source-layer（PF-B10）。

profile: stie
kind: paper
