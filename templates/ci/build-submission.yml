name: build-submission

# 远程构建投稿包（docx / pdf / package / zip）。
# 工具链来自公共治理仓 PaperWorkflows/governance（master），本仓不内嵌副本。
# 门禁顺序遵循治理仓 build.md：validate → build docx/pdf → snapshot → package assemble
#   → package --verify-only --strict（投稿闸门）→ verify_layout → pack zip。
# 产物：actions/artifact「submission-zip」，文件名 仓库名+版本号（`<repo-name>-<paper_version>.zip`）；PF-B7 投稿名随 pack JSON 输出。

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build docx / pdf / package / zip
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout paper repository
        uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name }}

      - name: Checkout governance (build toolchain)
        uses: actions/checkout@v4
        with:
          repository: PaperWorkflows/governance
          ref: master
          path: governance

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (LibreOffice / CJK fonts / rsvg-convert / poppler-utils)
        run: |
          sudo apt-get update
          # librsvg2-bin（rsvg-convert）：pandoc 生成 docx 时对 SVG 图片的光栅回退
          # 依赖 rsvg-convert（GC-2026-1113-02 svg_alternatives_preserved 校验要求
          # 每个 svgBlip 必带位图 r:embed）；缺失时 pandoc 产出 SVG-only blip，构建硬失败。
          # poppler-utils（pdffonts/pdftoppm/pdftotext/pdfimages）：PDF 构建校验
          # （字体清单、页面光栅、版面 bbox、图像清单）依赖；缺失时 pdf-verify 阶段
          # 硬失败（"pdffonts unavailable"），PDF 无法验证不得发布。
          sudo apt-get install -y --no-install-recommends libreoffice fonts-noto-cjk librsvg2-bin poppler-utils
          soffice --version | head -1
          rsvg-convert --version | head -1
          pdffonts -v 2>&1 | head -1

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema pypandoc-binary

      # pandoc 用 pypandoc-binary 的捆绑二进制：与本地构建所用二进制同源同版本，
      # 保证 --print-default-data-file reference.docx 与 PF-B11 refdoc 同步校验基线一致
      # （官方 deb 构建在 CI 上的 SVG→PNG 回退行为与本地不一致，2026-11-16 实测）。
      - name: Pin pandoc (pypandoc-binary)
        run: |
          PANDOC_BIN="$(python -c 'import pathlib, pypandoc; print(pathlib.Path(pypandoc.__file__).parent / "files" / "pandoc")')"
          echo "bundled pandoc: $PANDOC_BIN"
          "$PANDOC_BIN" --version | head -1
          echo "$(dirname "$PANDOC_BIN")" >> "$GITHUB_PATH"
          pandoc --version | head -1

      # PF-PL1 准入校验为咨询步骤：budget.confirmed 等字段属用户决策项（各篇 paper.yaml
      # unresolved 已登记"不得擅改"），本地构建流程同样不以其为阻断，故 CI 不阻断；
      # 投稿闸门由后续 package --verify-only --strict 强制承载。
      - name: Workspace schema validation (advisory)
        continue-on-error: true
        run: python3 -I governance/tools/paper.py validate --paper "$GITHUB_WORKSPACE/${{ github.event.repository.name }}"

      - name: Build docx
        run: python3 -I governance/tools/paper.py build docx --paper "$GITHUB_WORKSPACE/${{ github.event.repository.name }}"

      - name: Build pdf
        run: python3 -I governance/tools/paper.py build pdf --paper "$GITHUB_WORKSPACE/${{ github.event.repository.name }}"

      - name: Input snapshot (PF-B4)
        run: python3 -I governance/tools/paper.py build snapshot --paper "$GITHUB_WORKSPACE/${{ github.event.repository.name }}"

      - name: Assemble submission package (PF-B16)
        run: python3 -I governance/tools/paper.py package --paper "$GITHUB_WORKSPACE/${{ github.event.repository.name }}"

      - name: Verify package strict (submission gate)
        run: python3 -I governance/tools/paper.py package --paper "$GITHUB_WORKSPACE/${{ github.event.repository.name }}" --verify-only --strict

      - name: Layout verification
        run: python3 -I governance/tools/verify_layout.py --paper-root "$GITHUB_WORKSPACE"

      - name: Pack submission zip
        run: python3 -I governance/tools/pack_submission_zip.py --paper "$GITHUB_WORKSPACE/${{ github.event.repository.name }}" --out "$GITHUB_WORKSPACE/dist"

      - name: Upload submission zip
        uses: actions/upload-artifact@v4
        with:
          name: submission-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
