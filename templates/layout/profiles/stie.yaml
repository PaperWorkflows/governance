# ── authors 域：作者 / 单位 / 关联 / 简介 结构（GC-2026-1112-06 阶段 0+1 新增，元数据驱动生成）──
# 只承载"结构键 + 少量格式参数"，不硬编码整句模板；整句由生成器（阶段 2 tools/paper.py）按
# 元数据拼接。字号字体一律沿用现 profile 值（本轮只加结构与关联模式，不加字号）。
#
# S2 偏差登记（PF-W12：范本实证优先于期刊文字明示）：
#   writing-spec.yaml `author_affiliation_inline` [S2] 现登记「作者姓名（一级单位全称
#   二级单位全称，所在市 邮编）」行内括号式；范本实证（extract-report §2 行 2/3/4、§8）为
#   上标编号式——姓名后上标单位编号、单位列表置于独立居中单位行。按 PF-W12 以范本实证
#   优先，本文档落地为上标编号式（affiliation_style: numbered_superscript）；
#   writing-spec 的 S2 原文保留不删（作为期刊明示原文登记，供编辑部核实时引用）。
authors:
  affiliation_style: numbered_superscript   # [JT] 上标编号式（S2 偏差登记见上方注释块）。
                                           # 声明键（终审返工 P2-3）：生成器当前实作 numbered_superscript
                                           # 范本形态，inline_parenthesized 需生成器开发（非活开关）
  corresponding_mark: "*"                   # [S18] 通信作者姓名右上角上标星号
  corresponding_mark_position: after_numbers  # [JT] 范本上标「1,2,*」星号置于单位编号之后
  name_separator_zh: "，"                   # [JT] 中文署名作者间全角逗号（张汉宁，勾善文，…）
  name_separator_en: ", "                   # [JT] 英文署名作者间半角逗号+空格（ZHANG Hanning, GOU Shanwen, …）
  number_separator: ","                     # [JT] 单位编号之间半角逗号（1,2,*）
  affiliation_list_alignment: center        # [JT] 中/英单位行均居中（长列表折行仍居中）
                                           # 声明键（终审返工 P2-3）：生成器当前实作 center，切换需生成器开发
  front_order:                              # [JT] 首页自上而下顺序（extract-report §2 逐行实录）
    - title_zh                             #   1 中文标题
    - authors_zh                           #   2 中文署名（含上标）
    - affiliations_zh                      #   3 中文单位（编号列表）
    - abstract                             #   4 中文摘要
    - keywords                             #   5 中文关键词
    - funding                              #   6 基金项目（插在关键词与英文标题之间）
    - title_en                             #   7 英文标题
    - authors_en                           #   8 英文署名（含上标）
    - affiliations_en                      #   9 英文单位（编号列表）
    - abstract_en                          #  10 英文 Abstract
    - keywords_en                          #  11 英文 Keywords
  front_corresponding_line: false          # [JT]+用户裁定：首页无独立通信作者行；通信信息只以
                                           #   署名上标 *（corresponding_mark）+ 文末「通信作者*」段承载
                                           # 声明键（终审返工 P2-3）：生成器当前实作 false，
                                           # true（前端通信行）需生成器开发
  funding_positions: [front, back]         # [JT] 基金项目重复登出两处：首页（关键词后）+ 文末
                                           #   作者信息节首段（写法略异，范文实证）
  bio_section:                             # [S17]+[JT]
    heading: 作者信息                       # [JT] 文末节标题（宋体、无编号、顶格）
    position: after_references             # [JT] 位于参考文献之后
                                           # 声明键（终审返工 P2-3）：生成器当前实作
                                           # after_references，切换需生成器开发
    paragraph_labels:                      # [JT] 四段依次；标签后接全角冒号「：」由生成器拼接，不硬编码进模板
