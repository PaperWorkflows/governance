# 作用域：papers/ 下 P1–P7 共同目标刊（paper.yaml.layout_profile: stie）。
#
# 来源等级（source_level）约定——避免把"我们选的"当成"期刊要求的"：
#   [S#]     本刊格式要求明示（S1–S20）
#   [GB]     国标基线回落（本刊未规定）：GB/T 7713.2-2022 附录 B 表 B.1 等
#   [CY]     行业标准：CY/T 170-2019
#   [JT]     期刊模板实测（线宽等非国标项）
#   [TD]     通行做法（无单一权威源）
# 本刊明示文本完全未规定：字号、字体、页边距、行距、页码、图题字号、三线表线宽——
# 这些一律回落国标基线并逐项标注；编辑部模板取得后以实测值覆盖（开放项）。
#
# 等级词表对照（PF-B14 注释式 provenance；本文件以缩写标注）：
#   [S#]=venue_requirement  [GB]=national_standard(_advisory)  [CY]=industry_standard
#   [JT]=journal_measured   [TD]=common_practice
# 结构化 provenance 块（键级）为开放项；当前以注释标注 + 变更记录登记为准。

# 覆写关系：本档覆盖 L0（draft）；论文 L2 只可再覆写 typography 可覆盖键。

profile: stie
kind: venue
