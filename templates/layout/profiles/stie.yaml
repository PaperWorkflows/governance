  # （CJK 记 2、拉丁记 1）按页内容宽比例分配，min_column_pct 为单列下限。
  column_widths: content
  min_column_pct: 5
  # cell_first_line_indent_chars: 0 —— [JT] 范本实测：表内文字全部顶格（无首行缩进）。
  # 作用于 pandoc Compact 样式（表格单元格段落与紧凑列表段，P1 实测 383 个表格段全部
  # Compact）：Compact basedOn BodyText → Normal，而 Normal 带 firstLineChars=200（正文
  # 正确），Compact 自身无 w:ind 因此继承正文 2 字缩进——此处显式归零覆写继承，正文段
  # （BodyText/FirstParagraph 走 Normal）不受影响。GC-2026-1112-06 后续修正。
  cell_first_line_indent_chars: 0       # [JT] 表内文字顶格；Compact 样式显式覆写 Normal 继承缩进
  header_alignment: center              # [CY] §7.2.2.2
  note_position: below_table            # [CY] §7.2.3.1
