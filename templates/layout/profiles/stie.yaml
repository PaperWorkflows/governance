    unit: upright                       # ②正体：单位、常量、函数名
    function: upright
    matrix_vector_tensor: bold_italic   # ③粗斜体：矩阵、向量、张量
    number_set: bold_upright            # ④粗正体：R、Z、N
citation:
  style: gb-7714-author-date            # [S13] 本刊采用著者出版年制
  system: author_date                   # [S13]
  entry_order: author_year_first        # [S16] "著者，出版年." 开头（与 GB 默认顺序不同，以本刊为准）
  standard_edition: "GB/T 7714-2015"    # [S13] 本刊文本引 2015 版
  standard_edition_note: "本刊文本引 GB/T 7714—2015；现行版为 GB/T 7714—2025（2026-07-01 实施），其 §9.3 著者-出版年制同为出版年前置于著者之后，与本刊 S16 模板一致。故著录按本刊 S16 模板执行（= 2025 版形态）；版次差异待编辑部确认（GC-2026-1111-02 开放项 15）"
  preferred_recency_years: 5            # [S13] 建议优先引用 5 年内成果
  in_text_forms:                        # [S14]（内容级核对清单见 PF-W11/PF-RV7；此处登记版式形式）
    zh_single: "张三（2020）"           # 全角括号、无逗号
    zh_double: "张三和李四（2020）"     # 著者间用"和"
    zh_multi: "张等（2020）"            # "等"（不加顿号）
    en_single: "(Smith, 2020)"          # 半角括号 + 半角逗号 + 半角空格
    en_double: "(Smith & Chick, 2020)"  # 著者间用 &
    en_multi: "(Smith et al., 2020)"    # et al.
    same_author_same_year_suffix: "a/b/c"  # 年份后加 a、b、c
    repeat_citation_page: "superscript"    # 出版年后角标著录引文页码
    joint_corporate_separator: "、"        # [SC] 联合团体著者间分隔（如"中共中央、国务院"）：刊方 S14 未规定团体著者形态 → 本项目自选回落（官方文件联合署名惯例用顿号；P3/P8 现状实践）。自然人双著者仍按 S14① 用"和"，本键不改变自然人规则。条目级联合著者仍按 GB/T 7714 逗号分隔（P8 L385–389、P9 L232/L276 条目实证），本键仅辖文内引注形态（GC-2026-1114-02）
  # 在线法律/政策文本：按刊方④[EB/OL] 模板著录（[S16]）：
  #   {author}, {year}. {title}[EB/OL]. （{update_date}）[{access_date}]. 网址：{url}.
  # 交叉引用刊方模板、不重复登记（单一真值源；GC-2026-1114-01）。
  fallback_entry_forms:                 # [GB] 刊方未规定 → GB/T 7714 回落条目模板（GC-2026-1114-01）
    law: "{author}, {year}. {title}（{version}）[Z]."                         # [GB] 法律法规；author=立法/发布主体，year=通过或修正年份，version 如"2020年修订"
    regulation: "{author}, {year}. {title}：{doc_number}[Z]."                 # [GB]+[JT] 规章/规范性文件；doc_number 如"财会〔2012〕21号"（P5 实例）
    standard: "{standard_no}, {year}. {title}[S]. {place}: {publisher}."      # [GB]+[JT] 标准；标准号置首作著者（P3 v0.3.16 范文实证）；例 GB/T 22239—2019，2019. 信息安全技术 网络安全等级保护基本要求[S]. 北京：中国标准出版社.；允许可选尾缀"（引用日期 {access_date}）"（P3 实例）
    standard_online: "{author}, {year}. {title}[S/OL]. {url}. （引用日期 {access_date}）."  # [GB]+[JT] 在线标准；author 二形态均可：标准号置首（同 [S] 惯例）或发布机构（P5 IETF 实例），按文献实际署名形态取用
references:
