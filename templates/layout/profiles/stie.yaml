  hanging_indent_cm: 0.74
  entry_spacing_pt: 0
pagination:
  page_number_position: footer_center   # [GB] GB/T 3179 §8.6（本刊未规定）
  header: title_center                  # [GB] §9.2
  header_pt: 9
