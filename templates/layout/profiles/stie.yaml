# L1 Venue Profile：《数智技术研究与应用》（"多模态时空大数据处理关键技术及应用研究"专刊）
#
# 依据：用户提供的该刊投稿格式要求全文（2026-11-11，编号 S1–S20，见各论文 writing-spec.yaml）。
# 作用域：papers/ 下 P1–P7 共同目标刊（paper.yaml.layout_profile: stie）。
#
# 来源等级（source_level）约定——避免把"我们选的"当成"期刊要求的"：
#   [S#]     本刊格式要求明示（S1–S20）
#   [S#-adv] 本刊格式要求为建议性（"一般不超过…""…为宜""建议"）——按目标值+容差执行
#   [GB]     国标基线回落（本刊未规定）：GB/T 7713.2-2022 附录 B 表 B.1 等
#   [CY]     行业标准：CY/T 170-2019
#   [JT]     期刊模板实测（线宽等非国标项）
#   [TD]     通行做法（无单一权威源）
#   [SC]     **本项目自选回落**——本刊未规定且国标亦未规定，由本项目选定
# 本刊明示文本完全未规定：字号、字体、页边距、行距、页码、图题字号、三线表线宽——
# 这些一律回落国标基线或自选回落并逐项标注；编辑部模板取得后以实测值覆盖（开放项）。
#
# 等级词表对照（PF-B14 注释式 provenance；本文件以缩写标注）：
#   [S#]=venue_requirement  [S#-adv]=venue_advisory
#   [GB]=national_standard / national_standard_advisory（资料性附录按后者理解）
#   [CY]=industry_standard  [JT]=journal_measured  [TD]=common_practice
#   [SC]=self_chosen
# 结构化 provenance 块（键级）为开放项；当前以注释标注 + 变更记录登记为准。
#
# 2026-11-12 变更说明：本档依据通过审稿范文（《基于可信数据空间的…跨域合规流通机制》v4.5(1).pdf）
# 实测对齐（GC-2026-1112-05 前置实施；final-recommendations.md A/C 档）；字号类
# （sizes.*、author_bio_layout.pt、页码字号等全部 pt 值）按用户裁定保持现值，本轮一律不动。
# 2026-11-13 变更说明（GC-2026-1112-06 阶段 0+1 前置）：新增 authors 域——作者/单位/关联/简介的
# 结构键 + 少量格式参数（不硬编码整句模板，整句由生成器阶段 2 按元数据拼接 tools/paper.py）；
# 字号字体类一律保持现值不动（本轮只加结构与关联模式，不加字号）。
# 2026-11-13 变更说明（GC-2026-1112-06 后续修正：表单元格缩进归零）：tables 域新增
# cell_first_line_indent_chars: 0——pandoc Compact 样式（表格单元格与紧凑列表）basedOn
# BodyText→Normal 继承正文 2 字首行缩进，此处显式覆写归零（[JT] 范本表内文字顶格）；
# 正文段缩进不受影响。三档 profile 一并生效（draft/gbt7713 缺省同归零）。

# 覆写关系：本档覆盖 L0（draft）；论文 L2 只可再覆写 typography 可覆盖键。

profile: stie
