# L0 Project Draft Profile（PF-B3 草案默认档，经 templates/layout/registry.yaml 登记）
#
# 结构身份键：本文件的 profile/kind/page 为结构身份键，不可被 paper config（L2）覆盖，
# 变更须经 profile 版本化（PF-B3）。typography 为 PF-B3 明示可覆盖键
# （"12pt body, 1.5x line spacing (overridable)"），L1/L2 可按键覆写。
#
# 数值依据 governance/build.md PF-B3 默认草案档：A4、25.4mm 四边边距、12pt 正文、1.5 倍行距。
# 三篇论文（P1/P2/P3）构建即按本档执行（见各论文 build/layout.yaml 与 build/ 目录）。
#
# GC-2026-1111-02（2026-11-11）：按角色化 schema 扩展补齐角色表。L0 语义保持"草案档"：
# 正文仍为 12pt（便于批注），其余角色按 GB/T 7713.2-2022 附录 B 表 B.1 铺底
# （资料性附录，"可参考"），使草案稿即具备中文科技论文的角色结构。
# 逐项来源：括号内标注；无标注项为 PF-B3 既有草案值。

profile: draft
kind: draft
page:                                   # PF-B3 草案默认（A4 / 25.4mm 四边）
  size: A4
  margin:
    top: 25.4
    bottom: 25.4
    left: 25.4
    right: 25.4
typography:
  body_pt: 12                           # PF-B3 草案默认（五号 10.5 为终稿基线，见 gbt7713-2-2022 档）
  line_spacing: 1.5                     # PF-B3 草案默认
  east_asia_font: "新宋体"
  latin_font: "Times New Roman"
  # 跨平台说明：若构建环境无新宋体/Times New Roman（如 Linux），
  # 可用 Noto Serif SC + TeX Gyre Termes 作为视觉等价替代（构建日志登记替换清单）。
  first_line_indent_chars: 2            # GB/T 7713.1-2025 §6.5.2
  fonts:                                # 角色字体（GB/T 7713.2-2022 附录 B 表 B.1）
    title_east_asia: "黑体"             # 题名黑体
    author_east_asia: "楷体"            # 作者楷体
    affiliation_east_asia: "宋体"
    abstract_east_asia: "仿宋"          # 摘要内容仿宋
    heading_east_asia: "黑体"           # 章节标题黑体
    caption_east_asia: "黑体"           # 图表题黑体
    math_latin: "Cambria Math"
    code_latin: "Consolas"
  sizes:                                # pt（附录 B 表 B.1；草案档正文保留 12pt）
    title_zh: 18                        # 小二
    title_en: 14                        # 四号
    author: 12                          # 小四
    affiliation: 9                      # 小五
    abstract: 9                         # 小五
    abstract_label: 9
    keywords: 9
    heading1: 12                        # 小四（章）
    heading2: 10.5                      # 五号（节）
    heading3: 10.5
    heading4: 10.5
    heading5: 10.5
    body: 12                            # 草案档正文（PF-B3）；终稿档为 10.5
    caption: 9                          # 小五
    table_body: 9
    table_note: 9
    reference_heading: 12
    reference_entry: 9
    footnote: 7.5
    author_bio: 9
    funding: 9
    page_number: 7.5
    header: 9
    code: 10.5
  paragraph:                            # 通行做法（GB/T 7713.2 体系；APA/IEEE/ACM 段前后均为 0）
    alignment: justify
    spacing_before_pt: 0
    spacing_after_pt: 0
  heading_numbering:                    # GB/T 7713.2-2022 §5.2.2（顶格、空一字、末尾不加点）
    max_level: 5
    recommended_max_level: 3
    formats: ["%1", "%1.%2", "%1.%2.%3", "（%4）", "①②③④⑤⑥⑦⑧⑨"]  # 第5级=带圈数字依次编号（S8）
    indent: flush_left
    number_title_gap_chars: 1
figures:
  caption_position: below               # GB/T 7713.2-2022 §5.4.3
  caption_pt: 9
  caption_alignment: center
  text_first: true
  cross_reference_required: true        # §5.2.4
tables:
  caption_position: above               # GB/T 7713.2-2022 §5.5.3 / CY/T 170-2019 §7.2.1.1
  caption_pt: 9
  caption_alignment: center
  style: three_line                     # CY/T 170-2019 §5.2
  border_widths_pt:                     # 《软件学报》2025 模板实测（线宽非国标，CY/T 170 仅"粗/细"）
    top: 1.0
    header: 0.5
    bottom: 1.0
  body_pt: 9
  header_alignment: center              # CY/T 170 §7.2.2.2（横表头居中、纵表头左齐）
  note_position: below_table            # CY/T 170 §7.2.3.1
formulas:
  renderer: omml                        # pandoc markdown 数学 → OMML
  editable_required: false              # 草案档允许探索性图片公式；venue 档（S9）收紧为 true
  display: centered                     # GB/T 7713.2-2022 §5.7.4
  numbering: right_paren                # §5.7.4
  symbol_styles:                        # GB 3100—3102 + GB/T 7713.2 §5.3.3/§5.3.5
    variable: italic
    unit: upright
    function: upright
    matrix_vector_tensor: bold_italic
    number_set: bold_upright
citation:
  style: gb-7714-2025                   # 现行版（顺序编码制为默认草案）
  system: numeric
references:
  order: [appearance]
  heading_pt: 12
  entry_pt: 9
  hanging_indent: true
  hanging_indent_cm: 0.74               # 约 2 字符 @9pt
  entry_spacing_pt: 0
pagination:
  page_number_position: footer_center   # GB/T 3179-2009 §8.6
  header: title_center                  # §9.2
  header_pt: 9
punctuation:                            # GB/T 15834-2011
  dash_em: 2
  ellipsis_em: 2
  interpunct_em: 0.5
  line_end_compression: half_width
author_bio_layout:
  pt: 9
  first_line_indent_chars: 2
  one_paragraph_per_author: true
